<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2038"/>
      <stop offset="0.55" stop-color="#123a5e"/>
      <stop offset="1" stop-color="#0e2b47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#3ad1c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ad1c4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ad1c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .node{fill:#0e2b47;stroke:url(#accent);stroke-width:2;}
      .nodeTxt{fill:#dbeeff8;font-size:15px;font-weight:600;}
      .link{stroke:#4aa3ff;stroke-width:2;fill:none;opacity:0.7;}
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#2a4a6a" stroke-width="1" opacity="0.25">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- glow blobs -->
  <circle cx="1050" cy="220" r="260" fill="url(#glow)"/>
  <circle cx="180" cy="600" r="220" fill="url(#glow)" opacity="0.6"/>

  <!-- top eyebrow -->
  <rect x="80" y="150" width="46" height="4" rx="2" fill="url(#accent)"/>
  <text x="138" y="158" fill="#7fc4ec" font-size="17" font-weight="700" letter-spacing="3">SPS COMMERCE &#183; DATA PLATFORM</text>

  <!-- title -->
  <text x="78" y="270" fill="#ffffff" font-size="78" font-weight="800" letter-spacing="-1">Informatica MCP</text>
  <text x="80" y="336" fill="url(#accent)" font-size="40" font-weight="700">IDMC, right inside Claude</text>

  <!-- subtitle -->
  <text x="82" y="392" fill="#b9d2e6" font-size="21">Monitor jobs, manage connections, and automate data pipelines &#8212;</text>
  <text x="82" y="422" fill="#b9d2e6" font-size="21">safely, from a single conversation.</text>

  <!-- pipeline motif -->
  <g transform="translate(82,500)">
    <!-- Claude -->
    <rect class="node" x="0" y="0" width="150" height="60" rx="12"/>
    <text x="75" y="35" text-anchor="middle" class="nodeTxt">Claude Desktop</text>
    <!-- link -->
    <path class="link" d="M150,30 L245,30"/>
    <text x="197" y="20" text-anchor="middle" fill="#7fc4ec" font-size="11">SSH</text>
    <!-- MCP server -->
    <rect x="245" y="0" width="170" height="60" rx="12" fill="#123a5e" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="330" y="27" text-anchor="middle" class="nodeTxt">MCP Server</text>
    <text x="330" y="46" text-anchor="middle" fill="#7fc4ec" font-size="12">on the box</text>
    <!-- link -->
    <path class="link" d="M415,30 L510,30"/>
    <text x="462" y="20" text-anchor="middle" fill="#7fc4ec" font-size="11">REST</text>
    <!-- IDMC -->
    <rect class="node" x="510" y="0" width="150" height="60" rx="12"/>
    <text x="585" y="35" text-anchor="middle" class="nodeTxt">Informatica IDMC</text>
    <!-- link -->
    <path class="link" d="M660,30 L755,30"/>
    <!-- Snowflake -->
    <rect class="node" x="755" y="0" width="150" height="60" rx="12"/>
    <text x="830" y="35" text-anchor="middle" class="nodeTxt">Snowflake</text>
  </g>

  <!-- footer -->
  <line x1="82" y1="632" x2="1198" y2="632" stroke="#2a4a6a" stroke-width="1"/>
  <text x="82" y="666" fill="#8fb0c9" font-size="16" font-weight="600">Joe Peck</text>
  <text x="82" y="688" fill="#5f7f97" font-size="14">Software Engineer, Data Platform</text>
  <text x="1198" y="666" text-anchor="end" fill="#8fb0c9" font-size="16" font-weight="600">2026</text>
  <text x="1198" y="688" text-anchor="end" fill="#5f7f97" font-size="14">Internal &#183; SPS Commerce</text>
</svg>
