<svg viewBox="0 0 880 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>How the Model Context Protocol works</title>
  <desc>A host application contains an LLM and an MCP client; the client speaks JSON-RPC over stdio or HTTP to multiple MCP servers, each wrapping an external system and exposing tools, resources, and prompts. A numbered flow shows a request round trip.</desc>
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="gb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c15f3c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="600" fill="#ffffff"/>

  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">Model Context Protocol (MCP) — the general pattern</text>
  <text x="440" y="48" text-anchor="middle" font-size="12" fill="#777">a USB port for AI: one protocol, any host, any number of servers</text>

  <rect x="25" y="150" width="110" height="56" rx="8" fill="#f5f4f0" stroke="#ccc"/>
  <text x="80" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">You</text>
  <text x="80" y="192" text-anchor="middle" font-size="10.5" fill="#777">ask in plain language</text>

  <rect x="175" y="90" width="220" height="240" rx="10" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
  <text x="285" y="82" text-anchor="middle" font-size="11" fill="#777">HOST APP (Claude Desktop, IDE, agent...)</text>

  <rect x="195" y="110" width="180" height="80" rx="8" fill="#f5f4f0" stroke="#c15f3c" stroke-width="1.5"/>
  <text x="285" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">LLM (Claude)</text>
  <text x="285" y="159" text-anchor="middle" font-size="10.5" fill="#777">reads tool list, picks a tool,</text>
  <text x="285" y="173" text-anchor="middle" font-size="10.5" fill="#777">fills in the arguments</text>

  <rect x="195" y="225" width="180" height="80" rx="8" fill="#f5f4f0" stroke="#ccc"/>
  <text x="285" y="255" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">MCP client</text>
  <text x="285" y="274" text-anchor="middle" font-size="10.5" fill="#777">one connection per server,</text>
  <text x="285" y="288" text-anchor="middle" font-size="10.5" fill="#777">speaks the protocol</text>

  <line x1="285" y1="190" x2="285" y2="221" stroke="#c15f3c" stroke-width="1.5" marker-end="url(#gb)" marker-start="url(#gb)"/>
  <line x1="135" y1="178" x2="191" y2="160" stroke="#777" stroke-width="1.5" marker-end="url(#ga)" marker-start="url(#ga)"/>

  <path d="M 375 245 C 440 200 460 155 520 128" fill="none" stroke="#c15f3c" stroke-width="1.5" marker-end="url(#gb)" marker-start="url(#gb)"/>
  <path d="M 375 265 C 440 265 460 265 520 265" fill="none" stroke="#c15f3c" stroke-width="1.5" marker-end="url(#gb)" marker-start="url(#gb)"/>
  <path d="M 375 285 C 440 330 460 375 520 402" fill="none" stroke="#c15f3c" stroke-width="1.5" marker-end="url(#gb)" marker-start="url(#gb)"/>
  <text x="447" y="250" text-anchor="middle" font-size="10.5" fill="#c15f3c">JSON-RPC</text>
  <text x="447" y="303" text-anchor="middle" font-size="10.5" fill="#777">stdio (local process)</text>
  <text x="447" y="317" text-anchor="middle" font-size="10.5" fill="#777">or HTTP (remote)</text>

  <rect x="524" y="95" width="180" height="70" rx="8" fill="#f5f4f0" stroke="#ccc"/>
  <text x="614" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">MCP server A</text>
  <text x="614" y="138" text-anchor="middle" font-size="10.5" fill="#777">e.g. chat / messaging</text>
  <text x="614" y="152" text-anchor="middle" font-size="10.5" fill="#777">tools: send, search...</text>

  <rect x="524" y="232" width="180" height="70" rx="8" fill="#f5f4f0" stroke="#ccc"/>
  <text x="614" y="257" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">MCP server B</text>
  <text x="614" y="275" text-anchor="middle" font-size="10.5" fill="#777">e.g. database</text>
  <text x="614" y="289" text-anchor="middle" font-size="10.5" fill="#777">tools: query, list_tables...</text>

  <rect x="524" y="369" width="180" height="70" rx="8" fill="#f5f4f0" stroke="#ccc"/>
  <text x="614" y="394" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">MCP server C</text>
  <text x="614" y="412" text-anchor="middle" font-size="10.5" fill="#777">e.g. issue tracker / files</text>
  <text x="614" y="426" text-anchor="middle" font-size="10.5" fill="#777">tools + resources + prompts</text>

  <line x1="704" y1="130" x2="748" y2="130" stroke="#777" stroke-width="1.5" marker-end="url(#ga)" marker-start="url(#ga)"/>
  <line x1="704" y1="267" x2="748" y2="267" stroke="#777" stroke-width="1.5" marker-end="url(#ga)" marker-start="url(#ga)"/>
  <line x1="704" y1="404" x2="748" y2="404" stroke="#777" stroke-width="1.5" marker-end="url(#ga)" marker-start="url(#ga)"/>
  <rect x="752" y="100" width="105" height="60" rx="8" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
  <text x="804" y="128" text-anchor="middle" font-size="11" fill="#777">SaaS API</text>
  <text x="804" y="144" text-anchor="middle" font-size="10.5" fill="#777">real system</text>
  <rect x="752" y="237" width="105" height="60" rx="8" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
  <text x="804" y="265" text-anchor="middle" font-size="11" fill="#777">Database</text>
  <text x="804" y="281" text-anchor="middle" font-size="10.5" fill="#777">real system</text>
  <rect x="752" y="374" width="105" height="60" rx="8" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
  <text x="804" y="402" text-anchor="middle" font-size="11" fill="#777">API / file system</text>
  <text x="804" y="418" text-anchor="middle" font-size="10.5" fill="#777">real system</text>

  <text x="440" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">One request, round trip</text>
  <text x="440" y="514" text-anchor="middle" font-size="11" fill="#777">1. you ask → 2. LLM picks a tool from the servers' advertised lists → 3. client sends tools/call (JSON-RPC)</text>
  <text x="440" y="532" text-anchor="middle" font-size="11" fill="#777">4. server hits the real system and returns a result → 5. LLM reads the result and answers you in plain language</text>
  <text x="440" y="562" text-anchor="middle" font-size="10.5" fill="#777">Servers expose three primitives: tools (actions the model calls) · resources (data to read) · prompts (reusable templates)</text>
</svg>
